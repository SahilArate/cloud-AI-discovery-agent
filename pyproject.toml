[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-discovery-agent"
version = "0.1.0"
description = "Agent-based discovery of AI usage and shadow AI across AWS, GCP and Azure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[awslambda,ec2,sagemaker,secretsmanager]>=5.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
[tool.setuptools.package-data]
ai_discovery = ["catalog/*.yaml"]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"