services:
  db:
    image: postgres:16
    container_name: ai-discovery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-discovery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discovery}
      POSTGRES_DB: ${POSTGRES_DB:-ai_discovery}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discovery} -d ${POSTGRES_DB:-ai_discovery}"]
      interval: 5s
      timeout: 3s
      retries: 10